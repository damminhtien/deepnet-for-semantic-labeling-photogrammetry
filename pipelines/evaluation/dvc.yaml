# This optional pipeline creates held-out evaluation bundles separately from the
# default training pipeline. Invoke it explicitly when packaging the full run.
stages:
  validate_potsdam_test:
    wdir: ../..
    cmd: >-
      deepnet-data validate-catalog --catalog data/prepared/potsdam/catalog.json
      --split configs/splits/potsdam-dinov3-v2.json --require-hashes
      --view-assets irrg-view=irrg --include-split test
      > data/prepared/potsdam/post-selection-test-validation.json
    deps:
      - configs/splits/potsdam-dinov3-v2.json
      - data/prepared/potsdam/catalog.json
      - deepnet/data
    outs:
      - data/prepared/potsdam/post-selection-test-validation.json

  quality_potsdam_test:
    wdir: ../..
    cmd: >-
      deepnet-data quality-report --catalog data/prepared/potsdam/catalog.json
      --split configs/splits/potsdam-dinov3-v2.json
      --preprocessing-id isprs-canonical-v2
      --data-root data/raw/inputs --tile-size 1024
      --view-assets irrg-view=irrg --include-split test
      --output data/prepared/potsdam/post-selection-test-quality.json
    deps:
      - configs/preprocessing/isprs-canonical-v2.json
      - configs/splits/potsdam-dinov3-v2.json
      - data/prepared/potsdam/post-selection-test-validation.json
      - data/raw/inputs/potsdamvaihingen/3_ortho_irrg/3_Ortho_IRRG
      - data/raw/inputs/label-all-potsdam-vaihingen/5_labels_all_noboundary
      - deepnet/data
    outs:
      - data/prepared/potsdam/post-selection-test-quality.json

  bundle_potsdam_test:
    wdir: ../..
    cmd: >-
      deepnet-data export-bundle --catalog data/prepared/potsdam/catalog.json
      --split configs/splits/potsdam-dinov3-v2.json
      --preprocessing-id isprs-canonical-v2
      --model-input-id isprs-irrg-unit-v1 --data-root data/raw/inputs
      --include-split test
      --output data/prepared/potsdam/post-selection-test-bundle
    deps:
      - configs/model-inputs/isprs-irrg-unit-v1.json
      - configs/preprocessing/isprs-canonical-v2.json
      - configs/splits/potsdam-dinov3-v2.json
      - data/prepared/potsdam/catalog.json
      - data/prepared/potsdam/post-selection-test-validation.json
      - data/prepared/potsdam/post-selection-test-quality.json
      - data/raw/inputs/potsdamvaihingen/3_ortho_irrg/3_Ortho_IRRG
      - data/raw/inputs/label-all-potsdam-vaihingen/5_labels_all_noboundary
      - deepnet/data
    outs:
      - data/prepared/potsdam/post-selection-test-bundle

  validate_vaihingen_test:
    wdir: ../..
    cmd: >-
      deepnet-data validate-catalog --catalog data/prepared/vaihingen/catalog.json
      --split configs/splits/vaihingen-dinov3-v1.json --require-hashes
      --view-assets irrg-view=irrg --include-split test
      > data/prepared/vaihingen/post-selection-test-validation.json
    deps:
      - configs/splits/vaihingen-dinov3-v1.json
      - data/prepared/vaihingen/catalog.json
      - deepnet/data
    outs:
      - data/prepared/vaihingen/post-selection-test-validation.json

  quality_vaihingen_test:
    wdir: ../..
    cmd: >-
      deepnet-data quality-report --catalog data/prepared/vaihingen/catalog.json
      --split configs/splits/vaihingen-dinov3-v1.json
      --preprocessing-id isprs-canonical-v2
      --data-root data/raw/inputs --tile-size 1024
      --view-assets irrg-view=irrg --include-split test
      --output data/prepared/vaihingen/post-selection-test-quality.json
    deps:
      - configs/preprocessing/isprs-canonical-v2.json
      - configs/splits/vaihingen-dinov3-v1.json
      - data/prepared/vaihingen/post-selection-test-validation.json
      - data/raw/inputs/vaihingen-isprs-official-20261019/images
      - data/raw/inputs/vaihingen-isprs-official-20261019/labels_eroded
      - deepnet/data
    outs:
      - data/prepared/vaihingen/post-selection-test-quality.json

  bundle_vaihingen_test:
    wdir: ../..
    cmd: >-
      deepnet-data export-bundle --catalog data/prepared/vaihingen/catalog.json
      --split configs/splits/vaihingen-dinov3-v1.json
      --preprocessing-id isprs-canonical-v2
      --model-input-id isprs-irrg-unit-v1 --data-root data/raw/inputs
      --include-split test
      --output data/prepared/vaihingen/post-selection-test-bundle
    deps:
      - configs/model-inputs/isprs-irrg-unit-v1.json
      - configs/preprocessing/isprs-canonical-v2.json
      - configs/splits/vaihingen-dinov3-v1.json
      - data/prepared/vaihingen/catalog.json
      - data/prepared/vaihingen/post-selection-test-validation.json
      - data/prepared/vaihingen/post-selection-test-quality.json
      - data/raw/inputs/vaihingen-isprs-official-20261019/images
      - data/raw/inputs/vaihingen-isprs-official-20261019/labels_eroded
      - deepnet/data
    outs:
      - data/prepared/vaihingen/post-selection-test-bundle
